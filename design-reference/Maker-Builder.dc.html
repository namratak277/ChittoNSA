<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Maker question builder</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1D4ED8}a:hover{color:#1E1B2E}
button,input,textarea,select{font-family:inherit}
button{cursor:pointer}
</style>
</helmet>
<div style="width: 1280px; height: 720px; box-sizing: border-box; background: #F6F4EE; color: #1E1B2E; font-family: 'Baloo 2', system-ui, sans-serif; display: flex; flex-direction: column">
  <div style="height: 68px; flex-shrink: 0; background: #1E1B2E; color: #fff; display: flex; align-items: center; gap: 16px; padding: 0 24px">
    <a href="Maker-Dashboard.dc.html" style="color: #D9D6E4; font-size: 16px; text-decoration: none">← My games</a>
    <div style="font-size: 21px; font-weight: 800">Dashain &amp; Democracy Night</div>
    <span style="font-size: 14px; color: #B9B5C9">Saved</span>
    <div style="margin-left: auto; display: flex; gap: 10px">
      <a href="Maker-Dashboard.dc.html" style="min-height: 44px; padding: 0 18px; border-radius: 10px; border: 2px solid #fff; color: #fff; display: flex; align-items: center; font-size: 16px; font-weight: 700; text-decoration: none">Save</a>
      <a href="Maker-Host.dc.html" style="min-height: 44px; padding: 0 18px; border-radius: 10px; background: #DC2626; color: #fff; display: flex; align-items: center; font-size: 16px; font-weight: 800; text-decoration: none">Host this game</a>
    </div>
  </div>
  <div style="flex-grow: 1; display: flex; min-height: 0">
    <div style="width: 270px; flex-shrink: 0; border-right: 2px solid #E2DED3; padding: 18px 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 6px; overflow: hidden">
      <div style="font-size: 14px; font-weight: 800; letter-spacing: 1px; color: #4A4660">5 CHECKPOINTS · 12 QUESTIONS</div>
      <div style="display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 10px; font-size: 15px"><b>1</b><span style="flex-grow: 1">Everest in Nepali?</span><span style="width: 10px; height: 10px; border-radius: 50%; background: #DC2626"></span></div>
      <div style="display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 10px; font-size: 15px"><b>2</b><span style="flex-grow: 1">Voting age (26th Amend.)</span><span style="width: 10px; height: 10px; border-radius: 50%; background: #1D4ED8"></span></div>
      <div style="display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 10px; font-size: 15px"><b>3</b><span style="flex-grow: 1">Flag shape</span><span style="width: 10px; height: 10px; border-radius: 50%; background: #DC2626"></span></div>
      <div style="display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 10px; font-size: 15px"><b>4</b><span style="flex-grow: 1">Where to register</span><span style="width: 10px; height: 10px; border-radius: 50%; background: #1D4ED8"></span></div>
      <div style="display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 10px; font-size: 15px; background: #fff; border: 2px solid #1E1B2E"><b>5</b><span style="flex-grow: 1; font-weight: 700">Dashain length</span><span style="width: 10px; height: 10px; border-radius: 50%; background: #DC2626"></span></div>
      <div style="display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 10px; font-size: 15px"><b>6</b><span style="flex-grow: 1">Storm event cards</span><span style="font-size: 12px; font-weight: 800; color: #15803D">EVENT</span></div>
      <div style="display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 10px; font-size: 15px; color: #4A4660"><b>7–12</b><span style="flex-grow: 1">…</span></div>
      <button type="button" style="margin-top: 6px; min-height: 44px; border-radius: 10px; border: 2px dashed #8A86A0; background: transparent; font-size: 16px; font-weight: 700">+ Add question</button>
      <div style="margin-top: auto; font-size: 13px; color: #4A4660; display: flex; gap: 12px"><span><span style="display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #DC2626"></span> Nepal culture</span><span><span style="display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #1D4ED8"></span> Voting</span></div>
    </div>
    <div style="flex-grow: 1; padding: 22px 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; min-width: 0">
      <div style="display: flex; gap: 14px">
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px">
          <label for="qtext" style="font-size: 14px; font-weight: 800">Question 5</label>
          <input id="qtext" value="Dashain, Nepal's biggest festival, lasts how many days?" style="height: 50px; border: 2px solid #1E1B2E; border-radius: 12px; padding: 0 14px; font-size: 18px; background: #fff; box-sizing: border-box">
        </div>
        <div style="width: 180px; display: flex; flex-direction: column; gap: 4px">
          <label for="qtopic" style="font-size: 14px; font-weight: 800">Topic</label>
          <select id="qtopic" style="height: 50px; border: 2px solid #1E1B2E; border-radius: 12px; padding: 0 10px; font-size: 16px; background: #fff"><option>Nepali culture</option><option>Voting in the U.S.</option></select>
        </div>
        <div style="width: 120px; display: flex; flex-direction: column; gap: 4px">
          <label for="qtime" style="font-size: 14px; font-weight: 800">Timer</label>
          <select id="qtime" style="height: 50px; border: 2px solid #1E1B2E; border-radius: 12px; padding: 0 10px; font-size: 16px; background: #fff"><option>20 sec</option><option>30 sec</option><option>10 sec</option></select>
        </div>
      </div>
      <div style="font-size: 14px; font-weight: 800">Answers · mark the right one</div>
      <sc-for list="{{ answers }}" as="a" hint-placeholder-count="4">
        <div style="display: flex; gap: 12px; align-items: center">
          <span style="{{ a.chip }}">{{ a.letter }}</span>
          <input aria-label="{{ a.aria }}" value="{{ a.label }}" style="flex-grow: 1; height: 46px; border: 2px solid #1E1B2E; border-radius: 12px; padding: 0 14px; font-size: 17px; background: #fff; box-sizing: border-box">
          <button type="button" onClick="{{ a.mark }}" aria-pressed="{{ a.pressed }}" style="{{ a.markStyle }}">{{ a.markText }}</button>
        </div>
      </sc-for>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <label for="qfact" style="font-size: 14px; font-weight: 800">Trail fact (shown after the reveal)</label>
        <textarea id="qfact" rows="2" style="border: 2px solid #1E1B2E; border-radius: 12px; padding: 10px 14px; font-size: 16px; background: #fff; resize: none">Families gather for Dashain, and elders give tika and blessings. It celebrates good winning over evil.</textarea>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { right: 2 }; }
  renderVals() {
    const opts = [
      { label: '3 days', letter: 'क', bg: '#1D4ED8', fg: '#fff' },
      { label: '7 days', letter: 'ख', bg: '#DC2626', fg: '#fff' },
      { label: '15 days', letter: 'ग', bg: '#15803D', fg: '#fff' },
      { label: '30 days', letter: 'घ', bg: '#F2B705', fg: '#1E1B2E' }
    ];
    const r = this.state.right;
    return {
      answers: opts.map((o, i) => ({
        ...o,
        aria: 'Answer ' + o.letter,
        chip: 'width: 46px; height: 46px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 800; clip-path: polygon(0 0, 100% 0, 100% 84%, 75% 100%, 50% 84%, 25% 100%, 0 84%); background: ' + o.bg + '; color: ' + o.fg,
        pressed: i === r ? 'true' : 'false',
        markText: i === r ? 'Right answer ✓' : 'Mark right',
        markStyle: 'width: 150px; min-height: 46px; border-radius: 12px; font-size: 15px; font-weight: 800; ' + (i === r ? 'background: #15803D; color: #fff; border: 2px solid #15803D' : 'background: #fff; color: #1E1B2E; border: 2px solid #1E1B2E'),
        mark: () => this.setState({ right: i })
      }))
    };
  }
}
</script>
</body>
</html>
